[project]
name = "glyph"
version = "0.1.0"
description = "Sandbox-supervised consequence prediction for coding agents"
requires-python = "==3.12.*"
dependencies = [
    "openai==2.32.0",
    "pyarrow==25.0.0",
    "transformers==5.6.2",
    "verifiers==0.2.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyph"]

[tool.uv]
prerelease = "allow"
