# Restate control: Arm B traces with every PREDICTION line set to the expected value.
max_steps = 20
output_dir = "outputs/arm_b_restate_sft"

[wandb]
project = "predict-mbpp-1.7b"
group = "matched-sft"
name = "arm-b-restate-sft"

[model]
name = "Qwen/Qwen3-1.7B-Base"
impl = "auto"
seq_len = 1792

[tokenizer]
chat_template = "configs/chat_template.jinja"
eos_token = "<|endoftext|>"

[data]
type = "sft"
name = "data/sft/arm_b_restate"
batch_size = 32
micro_batch_size = 1
seq_len = 1792
pack_function = "stack"
shuffle = true
seed = 42

[data.loss_mask]
system = false
user = false
assistant = true
tool = false

[optim]
type = "adamw"
lr = 2e-5
weight_decay = 0.01

[scheduler]
type = "linear"
warmup_steps = 2
decay_steps = 18
min_lr = 0.0

[ckpt]
interval = 20
keep_last = 1
weights_only = true

[deployment]
type = "single_node"
num_gpus = 1
gpus_per_node = 1
