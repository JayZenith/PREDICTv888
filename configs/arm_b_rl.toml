# Arm B: GRPO with value predictions after each patch.
max_steps = 50
seq_len = 4096
output_dir = "outputs/arm_b_rl"

[model]
name = "outputs/arm_b_sft/weights/step_20"

[tokenizer]
chat_template = "configs/chat_template.jinja"

[wandb]
project = "predict-mbpp-1.7b"
group = "matched-arms"
name = "arm-b-grpo"

[orchestrator]
batch_size = 128
group_size = 16

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "default"

[orchestrator.train.sampling]
temperature = 0.8
max_completion_tokens = 512
extra_body = { stop_token_ids = [151643], top_k = 20 }

[[orchestrator.train.env]]
name = "arm-b-train"
taskset = { id = "glyph", data_path = "data/arm_b_train.jsonl", task = { max_trace_tokens = 4096 } }
harness = { id = "glyph", arm = "b", runtime = { type = "subprocess" }, max_tool_calls = 8, tool_timeout = 30 }
pool = { type = "elastic", max_workers = 16, multiplex = 4 }

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = true

[trainer.loss]
type = "default"
kl_tau = 0.0

[trainer.optim]
lr = 3e-6
weight_decay = 0.01

[ckpt]
interval = 50
keep_last = 1

[orchestrator.ckpt]
wait_for_weights_timeout = 60

[trainer.ckpt]
weights_only = true

[inference]
gpu_memory_utilization = 0.85
seed = 42

[weight_broadcast]
type = "filesystem"

[deployment]
type = "single_node"
num_train_gpus = 1
num_infer_gpus = 1
gpus_per_node = 2
